[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "mirrorball"
description = "Standardized benchmarking tools for statistical models and optimizers in high-energy physics."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]
authors = [
    { name = "Mohamed Aly", email = "mohamed.aly@cern.ch" },
    { name = "Peter Fackeldey", email = "peter.fackeldey@cern.ch" },
]
dependencies = [
    "google-benchmark",
    "jax>=0.7.2",
    "optimistix>=0.0.10",
    "evermore",
    "everwillow",
    "pyhf",
    "pyhs3",
    "iminuit>=2.31.3",
    "scipy",
]


[dependency-groups]
test = ["pytest >=7", "pytest-cov >=3", "coverage[toml]"]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser<5",
    "sphinx-design",
    "sphinx-togglebutton",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
    "myst-nb",
    "sphinxcontrib-mermaid",
]
examples = [
    "rich",
    "matplotlib>=3.10.7",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "examples" },
    "ipython",
    "ruff",
    "pre_commit",
    "mypy",
]


[project.urls]
Homepage = "https://github.com/MoAly98/mirrorball"
"Bug Tracker" = "https://github.com/MoAly98/mirrorball/issues"
Discussions = "https://github.com/MoAly98/mirrorball/discussions"
Changelog = "https://github.com/MoAly98/mirrorball/releases"


[tool.hatch]
version.path = "src/mirrorball/__init__.py"


[tool.pytest.ini_options]
minversion = "7"
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["src"]
filterwarnings = [
    "error",
]
log_cli_level = "INFO"
testpaths = ["tests"]


[tool.coverage]
run.source = ["mirrorball"]
port.exclude_lines = ['pragma: no cover', '\.\.\.', 'if typing.TYPE_CHECKING:']


[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
strict = false
ignore_missing_imports = true


[tool.ruff.lint]
preview = true
ignore = [
    "PLR",
    "E501",
    "I002",
    "ISC001",
    "PLC0415",
    "PLW3201",
    "RUF052",
    "F722",
]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "C4",
    "EM",
    "ICN",
    "ISC",
    "G",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "YTT",
    "EXE",
    "E303",
]
unfixable = [
    "F841",
]
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]

[tool.uv.sources]
pyhs3 = { git = "https://github.com/MoAly98/pyhs3", branch = "fix/funcs_ref_funcs" }
evermore = { git = "https://github.com/pfackeldey/evermore", branch = "main" }
pyhf = { git = "https://github.com/scikit-hep/pyhf", branch = "main" }
everwillow = { git = "https://github.com/MoAly98/everwillow", branch = "main" }
